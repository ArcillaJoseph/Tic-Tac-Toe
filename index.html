<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <header>
        <h1>Tic-Tac-Toe</h1>
    </header>

    <div class="container">
        <div class="status" id="status">Choose your mode!</div>
        <div class="score" id="score">Score - X: 0 | O: 0</div>

        <div class="mode-selector">
            <label for="mode">Choose Mode: </label>
            <select id="mode">
                <option value="friend">Play with Friend</option>
                <option value="computer">Play with Computer</option>
            </select>
        </div>

        <div class="difficulty-selector" id="difficulty-selector" style="display: none;">
            <label for="difficulty">AI Difficulty: </label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="board" id="board"></div>
        <button class="reset-button" id="reset">Reset Game</button>
        <p class="extra-info">Enjoy the game!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
